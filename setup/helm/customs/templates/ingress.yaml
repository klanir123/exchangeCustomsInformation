{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "customs.fullname" . }}-ingress
  labels:
    {{- include "customs.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: ui.customs
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "customs.fullname" . }}-ui
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}