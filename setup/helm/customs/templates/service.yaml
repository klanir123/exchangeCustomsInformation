apiVersion: v1
kind: Service
metadata:
  name: {{ include "customs.fullname" . }}-postgres
spec:
  ports:
    - port: {{ .Values.postgres.service.port }}
  selector:
    app: {{ include "customs.fullname" . }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "customs.fullname" . }}-backend
spec:
  ports:
    - port: {{ .Values.backend.service.port }}
  selector:
    app: {{ include "customs.fullname" . }}-backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "customs.fullname" . }}-ui
spec:
  ports:
    - port: {{ .Values.ui.service.port }}
  selector:
    app: {{ include "customs.fullname" . }}-ui
