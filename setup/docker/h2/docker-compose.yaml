name: customs-test

version: '3.7'

services:
  customs-backend:
    image: localhost/custom-backend-app:0.0.1
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=h2
  customs-ui:
    image: localhost/customs-ui:0.0.1
    ports:
      - "9090:9090"
    environment:
      - CUSTOMS_BACKEND_URI=http://customs-backend:8080