# EDC Setup for Customs KIT Testing
# Zwei EDC Connectoren für lokale Tests von Epic 5 (RequestCustomsInformation) und Epic 6 (CustomsNotification)
#
# Connector A (Provider/OEM): Repräsentiert das eigene Unternehmen - sendet Anfragen, empfängt LLE-Daten
# Connector B (Consumer/Supplier): Repräsentiert den Lieferanten - empfängt Anfragen, sendet LLE-Daten
#
# VORAUSSETZUNGEN:
# 1. Docker Desktop muss gestartet sein
# 2. GitHub Container Registry Login: docker login ghcr.io
#
# Start mit: docker compose up -d
# Stop mit: docker compose down
#
# Management API:
#   - Connector A (Provider): http://localhost:11002/api/management
#   - Connector B (Consumer): http://localhost:22002/api/management
#
# API-Dokumentation: https://edc-ce.docs.sovity.de/

name: customs-edc

services:
  # ============================================
  # Connector A - Provider/OEM (eigenes Unternehmen)
  # ============================================
  connector-a:
    image: ghcr.io/sovity/edc-dev:10.1.0
    container_name: customs-edc-connector-a
    environment:
      # Connector Identity
      MY_EDC_PARTICIPANT_ID: "BPNL000000000OEM"
      MY_EDC_TITLE: "Customs Provider (OEM)"
      MY_EDC_DESCRIPTION: "EDC Connector für Zoll-Anfragen (eigenes Unternehmen)"
      MY_EDC_CURATOR_URL: "https://oem-company.example.com"
      MY_EDC_CURATOR_NAME: "OEM Company GmbH"
      MY_EDC_MAINTAINER_URL: "https://oem-company.example.com"
      MY_EDC_MAINTAINER_NAME: "IT Department"

      # Network Configuration
      MY_EDC_FQDN: "connector-a"
      MY_EDC_PROTOCOL: "http://"
      EDC_DSP_CALLBACK_ADDRESS: "http://connector-a:11003/api/dsp"
      EDC_API_AUTH_KEY: "ApiKeyDefaultValue"

      # Database Configuration
      MY_EDC_JDBC_URL: "jdbc:postgresql://connector-a-db:5432/edc"
      MY_EDC_JDBC_USER: "edc"
      MY_EDC_JDBC_PASSWORD: "edc"

      # Port Configuration
      WEB_HTTP_PORT: "11001"
      WEB_HTTP_PATH: "/api"
      WEB_HTTP_MANAGEMENT_PORT: "11002"
      WEB_HTTP_MANAGEMENT_PATH: "/api/management"
      WEB_HTTP_PROTOCOL_PORT: "11003"
      WEB_HTTP_PROTOCOL_PATH: "/api/dsp"
      WEB_HTTP_PUBLIC_PORT: "11004"
      WEB_HTTP_PUBLIC_PATH: "/public"
      WEB_HTTP_CONTROL_PORT: "11005"
      WEB_HTTP_CONTROL_PATH: "/api/control"

      # Logging
      EDC_JSONLD_HTTPS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "11001:11001"  # Default API
      - "11002:11002"  # Management API
      - "11003:11003"  # DSP Protocol
      - "11004:11004"  # Public API
      - "11005:11005"  # Control API
      - "5005:5005"    # Debug
    depends_on:
      connector-a-db:
        condition: service_healthy
    networks:
      - edc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11001/api/check/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  connector-a-db:
    image: postgres:15
    container_name: customs-edc-connector-a-db
    environment:
      POSTGRES_USER: edc
      POSTGRES_PASSWORD: edc
      POSTGRES_DB: edc
    volumes:
      - connector-a-data:/var/lib/postgresql/data
    networks:
      - edc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edc"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Connector B - Consumer/Supplier (Lieferant)
  # ============================================
  connector-b:
    image: ghcr.io/sovity/edc-dev:10.1.0
    container_name: customs-edc-connector-b
    environment:
      # Connector Identity
      MY_EDC_PARTICIPANT_ID: "BPNL000000000SUP"
      MY_EDC_TITLE: "Customs Consumer (Supplier)"
      MY_EDC_DESCRIPTION: "EDC Connector für LLE-Daten (Lieferant)"
      MY_EDC_CURATOR_URL: "https://supplier-company.example.com"
      MY_EDC_CURATOR_NAME: "Supplier Company GmbH"
      MY_EDC_MAINTAINER_URL: "https://supplier-company.example.com"
      MY_EDC_MAINTAINER_NAME: "IT Department"

      # Network Configuration
      MY_EDC_FQDN: "connector-b"
      MY_EDC_PROTOCOL: "http://"
      EDC_DSP_CALLBACK_ADDRESS: "http://connector-b:22003/api/dsp"
      EDC_API_AUTH_KEY: "ApiKeyDefaultValue"

      # Database Configuration
      MY_EDC_JDBC_URL: "jdbc:postgresql://connector-b-db:5432/edc"
      MY_EDC_JDBC_USER: "edc"
      MY_EDC_JDBC_PASSWORD: "edc"

      # Port Configuration
      WEB_HTTP_PORT: "22001"
      WEB_HTTP_PATH: "/api"
      WEB_HTTP_MANAGEMENT_PORT: "22002"
      WEB_HTTP_MANAGEMENT_PATH: "/api/management"
      WEB_HTTP_PROTOCOL_PORT: "22003"
      WEB_HTTP_PROTOCOL_PATH: "/api/dsp"
      WEB_HTTP_PUBLIC_PORT: "22004"
      WEB_HTTP_PUBLIC_PATH: "/public"
      WEB_HTTP_CONTROL_PORT: "22005"
      WEB_HTTP_CONTROL_PATH: "/api/control"

      # Logging
      EDC_JSONLD_HTTPS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"
    ports:
      - "22001:22001"  # Default API
      - "22002:22002"  # Management API
      - "22003:22003"  # DSP Protocol
      - "22004:22004"  # Public API
      - "22005:22005"  # Control API
      - "5006:5006"    # Debug
    depends_on:
      connector-b-db:
        condition: service_healthy
    networks:
      - edc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:22001/api/check/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  connector-b-db:
    image: postgres:15
    container_name: customs-edc-connector-b-db
    environment:
      POSTGRES_USER: edc
      POSTGRES_PASSWORD: edc
      POSTGRES_DB: edc
    volumes:
      - connector-b-data:/var/lib/postgresql/data
    networks:
      - edc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edc"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  edc-network:
    driver: bridge

volumes:
  connector-a-data:
  connector-b-data:
