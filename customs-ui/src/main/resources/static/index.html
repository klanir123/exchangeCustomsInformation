<!DOCTYPE HTML>
<html lang="de">
<head>
    <title>Catena-X Customs Demonstrator</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="/css/styles.css" />
</head>
<body>
<div class="header">
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <ul id="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/tasks">Aufgaben</a></li>
        <li><a href="/parts">Produkte</a></li>
        <li><a href="/customs">LLE</a></li>
        <li><a href="#">User</a></li>
        <li><img src="/icon/msg_systems_logo_RGB.svg" alt="msg Logo" class="logo"></li>
    </ul>
</div>

<div class="main">
    <h1 class="fade-in">Catena-X Customs Demonstrator</h1>
    <p>Willkommen im ersten msg Demonstrator zum Austausch von Zollinformationen.</p>
    <p>Die Navigation innerhalb dieser Anwendung erfolgt über das oben eingeblendete Menü.</p>
    <hr>

    <div class="text-center mt-4">
        <h2 style="font-size: 1.5rem; margin-bottom: 24px; color: #666;">Schnellzugriff</h2>
        <button type="button" onclick="location.href='/parts'">Produkte</button>
        <button type="button" onclick="location.href='/customs'">Langzeitlieferantenerklärungen (LLE)</button>
    </div>
</div>

<script>
function toggleMenu() {
    const menu = document.getElementById('nav-menu');
    menu.classList.toggle('active');
}

// Close menu when clicking on a link (mobile)
document.querySelectorAll('#nav-menu a').forEach(link => {
    link.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
            document.getElementById('nav-menu').classList.remove('active');
        }
    });
});
</script>
</body>
</html>
