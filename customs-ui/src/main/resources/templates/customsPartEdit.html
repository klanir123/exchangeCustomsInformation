<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>partTable</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" />
</head>
<body>
<div class ="header">
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="#">Meine Aufgaben</a></li>
        <li><a href="/parts">Meine Produkte</a></li>
        <li><a href="/customs">Meine Langzeitlieferantenerklärungen (LLE)</a></li>
        <li><a href="#">User</a></li>
        <img src="./icon/msg_systems_logo_RGB.svg" alt="Logo" class="logo">
    </ul>
</div>
<div class="main">
    <h1 th:text="#{masterpart_overview_header_create}">Parts</h1>

<!--/*@thymesVar id="masterPart" type="com.msg.customs.domain.UiMasterPart"*/-->
    <form id="entryForm" action="#" th:action="@{/customs/part/save}" th:object="${masterPart}" method="post">
        <input type="hidden" th:field="*{id}" />
<table th:width="500px">
       <tr>
         <td><label for="catenaxId">Catena-X ID:</label></td>
         <td><input type="text" id="catenaxId" th:field="*{catenaxId}"></td>
        </tr>
    <tr>
        <td><label for="customerPartNumber">Kundensachnummer:</label></td>
        <td><input type="text" id="customerPartNumber" th:field="*{customerPartNumber}"></td>
    </tr>
    <tr>
    <td><label for="customerPartName">Bezeichnung Kundensachnummer:</label></td>
    <td><input type="text" id="customerPartName" th:field="*{customerPartName}"></td>
    </tr>
    <tr>
    <td><label for="partNumber">Sachnummer:</label></td>
    <td><input type="text" id="partNumber" th:field="*{manufacturerPartNumber}" ></td>
    </tr>
    <tr>
    <td> <label for="partName">Bezeichnung Sachnummer:</label></td>
    <td><input type="text" id="partName" th:field="*{manufacturerPartName}" ></td>
    </tr>
</table>
        <!--<input type="submit" value="Eintrag hinzufügen">-->
        <button type="submit" th:text="${masterPart.catenaxId} == null ? #{masterpart_action_create} : #{masterpart_action_update}">Eintrag hinzufuegen</button>
        <button type="button" onclick="location.href='/'">Abbrechen</button>
    </form>

</div>
</body>
</html>
