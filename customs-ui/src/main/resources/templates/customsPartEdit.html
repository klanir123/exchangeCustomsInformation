    body {

        float:right;

<body>
<img src="/icon/msg_systems_logo_RGB.svg" alt="Logo" class="logo">
<h1>Sachnummer in die Tabelle hinzufügen</h1>
<hr>


<!--/*@thymesVar id="masterPart" type="com.msg.customs.domain.UiMasterPart"*/-->
<form id="entryForm" action="#" th:action="@{/customs/part/save}" th:object="${masterPart}" method="post">

    <input type="hidden" th:field="*{id}" />

    <label for="catenaxId">Catena-X ID:</label>
    <input type="text" id="catenaxId" th:field="*{catenaxId}">

    <label for="customerPartNumber">Kundensachnummer:</label>
    <input type="text" id="customerPartNumber" th:field="*{customerPartNumber}">

    <label for="customerPartName">Bezeichnung Kundensachnummer:</label>
    <input type="text" id="customerPartName" th:field="*{customerPartName}">

    <label for="partNumber">Sachnummer:</label>
    <input type="text" id="partNumber" th:field="*{manufacturerPartNumber}" >

    <label for="partName">Bezeichnung Sachnummer:</label>
    <input type="text" id="partName" th:field="*{manufacturerPartName}" >

    <input type="submit" value="Eintrag hinzufügen">
</form>



<h1 th:text="#{overview_header}">Parts</h1>
<hr>

<table id="dataTable">
    <thead>
    <tr>
        <th>Catena-X ID</th>
        <th>Kundensachnummer</th>
        <th>Bezeichnung Kundensachnummer</th>
        <th>Sachnummer</th>
        <th>Bezeichnung Sachnummer</th>
    </tr>
    </thead>

    <tbody>
        <tr th:each="masterpart :${masterpartList}">
            <td>
                <a th:href="@{/customs/part/edit/{id}(id=${masterpart.catenaxId})}" th:text="${masterpart.catenaxId}">Edit</a>
            </td>
            <td th:text="${masterpart.customerPartNumber}"></td>
            <td th:text="${masterpart.customerPartName}"></td>
            <td th:text="${masterpart.manufacturerPartNumber}"></td>
            <td th:text="${masterpart.manufacturerPartName}"></td>
        </tr>
    </tbody>
</table>
