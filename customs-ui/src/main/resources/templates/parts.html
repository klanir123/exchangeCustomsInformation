<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <title>PArts</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" />
</head>
<body>
<div class="header">
    <ul>
        <li><a href="/" th:text="#{menu_home}">4</a></li>
        <li><a href="/tasks" th:text="#{menu_tasks}">4</a></li>
        <li><a href="/parts" th:text="#{menu_parts}">4</a></li>
        <li><a href="/customs" th:text="#{menu_lle}">4</a></li>
        <li><a href="#" th:text="#{menu_user}">4</a></li>
        <img src="icon/msg_systems_logo_RGB.svg" alt="Logo" class="logo">
    </ul>
</div>
<div class="main">
    <h1 th:text="#{masterpart_overview_header}">Parts</h1>
    <button onclick="location.href='/customs/part/create'" th:text="#{masterpart_overview_action_create}">Produkt anlegen</button>
    <button onclick="location.href='#'" th:text="#{masterpart_overview_action_upload}">Upload Produkte</button>


    <table>
    <thead>
    <tr>
        <th th:text="#{masterpart_overview_catenax_id}">Catena-X ID</th>
        <th th:text="#{masterpart_overview_customer_part_number}">Kundensachnummer</th>
        <th th:text="#{masterpart_overview_customer_part_name}">Bezeichnung Kundensachnummer</th>
        <th th:text="#{masterpart_overview_part_number}">Sachnummer</th>
        <th th:text="#{masterpart_overview_part_name}">Bezeichnung Sachnummer</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="masterpart :${masterpartList}">
        <td> <a th:href="@{/customs/part/edit/{id}(id=${masterpart.catenaxId})}" th:text="${masterpart.catenaxId}">Edit</a>

        </td>
        <td th:text="${masterpart.customerPartNumber}"></td>
        <td th:text="${masterpart.customerPartName}"></td>
        <td th:text="${masterpart.manufacturerPartNumber}"></td>
        <td th:text="${masterpart.manufacturerPartName}"></td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
