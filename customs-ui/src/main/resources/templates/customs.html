<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head> 
    <title>Getting Started: Serving Web Content</title> 
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" />
    <script>
        function notifySelected() {
            const selectedIds = Array.from(document.querySelectorAll('input[name="selectedIds"]:checked'))
                .map(checkbox => checkbox.value);
            fetch('/customs/notify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ catenaxIds: selectedIds })
            }).then(response => {
                if (response.ok) {
                    alert('Notification sent successfully');
                    document.querySelectorAll('input[name="selectedIds"]:checked').forEach(checkbox => checkbox.checked = false);
                } else {
                    alert('Failed to send notification');
                }
            });
        }
    </script>    
</head>
<body>


<div class ="header">
    <ul>
        <li><a href="/" th:text="#{menu_home}">4</a></li>
        <li><a href="/tasks" th:text="#{menu_tasks}">4</a></li>
        <li><a href="/parts" th:text="#{menu_parts}">4</a></li>
        <li><a href="/customs" th:text="#{menu_lle}">4</a></li>
        <li><a href="#" th:text="#{menu_user}">4</a></li>
        <img src="icon/msg_systems_logo_RGB.svg" alt="Logo" class="logo">
    </ul>
</div>
<div class="main">

    <h1 th:text="#{customs_overview_header}">Parts Customs Data</h1>

    <button onclick="location.href='/customs/create'" th:text="#{customs_overview_action_new_lle}">Neue LLE</button>
	<button onclick="notifySelected()" th:text="#{customs_overview_action_send_lle}">Sende LLE</button>
	
	<table>
        <thead>
            <tr>     
            	<th th:text="#{customs_overview_select}">Select</th>
                <th th:text="#{customs_overview_catenax_id}">Catena-X Id</th>
                <th th:text="#{customs_overview_customer_part_number}">Customer Part Number</th>
                <th th:text="#{customs_overview_customer_part_name}">Customer Part Name</th>
                <th th:text="#{customs_overview_customs_state}">Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="custom : ${customsList}">
            	<td><input type="checkbox" name="selectedIds" th:value="${custom.catenaxId}" /></td>
				<td>
            		<a th:href="@{/customs/edit/{id}(id=${custom.catenaxId})}" th:text="${custom.catenaxId}">Edit</a>
        		</td>            
                <td th:text="${custom.customerPartNumber}"></td>
                <td th:text="${custom.customerPartName}"></td>
                <td th:text="${custom.preferedStatus}"></td>
            </tr>
        </tbody>
	</table>
</div>
</body>
</html>
