<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <title>Langzeitlieferantenerklärung bearbeiten</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" />
    <script>
        function addOriginInformationField() {
            var inputField = document.getElementById("originInformation");
            var inputValue = inputField.value;
            if (inputValue.trim() !== "") {
                var hiddenField = document.getElementById("originInformations");
                var currentValues = hiddenField.value ? hiddenField.value.split(",") : [];
                currentValues.push(inputValue);
                hiddenField.value = currentValues.join(",");

                refreshOriginTable(currentValues);

                inputField.value = ""; // Clear the input field
            }
        }

        function removeOriginInformationField(index) {
            var hiddenField = document.getElementById("originInformations");
            var currentValues = hiddenField.value ? hiddenField.value.split(",") : [];
            if (index > -1 && index < currentValues.length) {
                currentValues.splice(index, 1);
                hiddenField.value = currentValues.join(",");
                refreshOriginTable(currentValues);
            }
        }

        function refreshOriginTable(currentValues) {
            var listContainer = document.getElementById("originListContainer");
            listContainer.innerHTML = "";
            currentValues.forEach(function (value, index) {
                var item = document.createElement("div");
                item.className = "origin-item";

                var span = document.createElement("span");
                span.textContent = value;
                item.appendChild(span);

                var removeIcon = document.createElement("img");
                removeIcon.src = "/icon/delete.png";
                removeIcon.alt = "Löschen";
                removeIcon.className = "small-icon";
                removeIcon.style.cursor = "pointer";
                removeIcon.onclick = function() { removeOriginInformationField(index); };
                item.appendChild(removeIcon);

                listContainer.appendChild(item);
            });
        }

        function toggleCountrySelectionChanged() {
            var country = document.getElementById("country").value;
            var federalState = document.getElementById("federalState");
            if (country !== "DE") {
                federalState.value = "";
                federalState.disabled = true;
            } else {
                federalState.disabled = false;
            }

            var prefferedStatus = document.getElementById("prefferedStatus");
            fetch(`/union/membership/${country}`)
            .then(response => response.json())
            .then(isEuMember => {
                var tracedWorthValue = document.getElementById("tracedWorthValue");
                var tracedWorthCurrency = document.getElementById("tracedWorthCurrency");
                if (isEuMember) {
                    prefferedStatus.disabled = false;
                } else {
                    prefferedStatus.value = "N";
                    prefferedStatus.disabled = true;
                    tracedWorthValue.disabled = false;
                    tracedWorthCurrency.disabled = false;
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function togglePrefferedStatusSelecttionChanged() {
            var prefferedStatus = document.getElementById("prefferedStatus").value;
            var tracedWorthValue = document.getElementById("tracedWorthValue");
            var tracedWorthCurrency = document.getElementById("tracedWorthCurrency");
            if (prefferedStatus === "N") {
                tracedWorthValue.disabled = false;
                tracedWorthCurrency.disabled = false;
            } else {
                tracedWorthValue.value = "";
                tracedWorthValue.disabled = true;
                tracedWorthCurrency.value = "";
                tracedWorthCurrency.disabled = true;
            }
        }

        function toggleMasterPartSelecttionChanged() {
            var e = document.getElementById("catenaxId");
            // Prüfen ob es ein Select-Element ist (nicht input bei leerer Liste)
            if (e && e.tagName === 'SELECT' && e.options && e.options.length > 0) {
                var selectedOption = e.options[e.selectedIndex];
                if (selectedOption) {
                    document.getElementById("customerPartNumber").value = selectedOption.getAttribute("value2") || '';
                    document.getElementById("customerPartName").value = selectedOption.getAttribute("value3") || '';
                    document.getElementById("manufacturerPartNumber").value = selectedOption.getAttribute("value4") || '';
                    document.getElementById("manufacturerPartName").value = selectedOption.getAttribute("value5") || '';
                }
            }
        }

        window.onload = function () {
            toggleCountrySelectionChanged();
            togglePrefferedStatusSelecttionChanged();
            // Produktfelder initial befüllen (wichtig wenn nur ein Produkt vorhanden ist)
            toggleMasterPartSelecttionChanged();
        }
    </script>
</head>
<body>
<div class="header">
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <ul id="nav-menu">
        <li><a href="/" th:text="#{menu_home}">Home</a></li>
        <li><a href="/tasks" th:text="#{menu_tasks}">Aufgaben</a></li>
        <li><a href="/lle-tasks">LLE-Aufgaben</a></li>
        <li><a href="/parts" th:text="#{menu_parts}">Produkte</a></li>
        <li><a href="/customs" th:text="#{menu_lle}" class="active">LLE</a></li>
        <li><a href="/suppliers" th:text="#{menu_suppliers}">Lieferanten</a></li>
        <li class="dropdown">
            <a href="#">Anfragen</a>
            <ul class="dropdown-menu">
                <li><a href="/requests/outgoing">Ausgehend</a></li>
                <li><a href="/requests/incoming">Eingehend</a></li>
            </ul>
        </li>
        <li class="dropdown">
            <a href="#">Benachrichtigungen</a>
            <ul class="dropdown-menu">
                <li><a href="/notifications/outgoing">Ausgehend</a></li>
                <li><a href="/notifications/incoming">Eingehend</a></li>
            </ul>
        </li>
        <li><a href="#" th:text="#{menu_user}">User</a></li>
        <li><img src="../icon/msg_systems_logo_RGB.svg" alt="msg Logo" class="logo"></li>
    </ul>
</div>

<div class="main">
    <h1 th:text="#{customs_edit_header}">Langzeitlieferantenerklärung bearbeiten</h1>

    <form action="#" th:action="@{/customs/doCreateOrUpdate}" th:object="${customs}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-grid">
            <!-- Produkt Informationen -->
            <div class="form-group">
                <label for="catenaxId" th:text="#{customs_edit_catenax_id}">Catena-X ID</label>
                <div>
                    <select id="catenaxId"
                            onchange="toggleMasterPartSelecttionChanged()"
                            th:field="*{catenaxId}"
                            th:unless="${#lists.isEmpty(masterpartList)}">
                        <option th:each="masterPart : ${masterpartList}"
                                th:value="${masterPart.catenaxId}"
                                th:value2="${masterPart.customerPartNumber}"
                                th:value3="${masterPart.customerPartName}"
                                th:value4="${masterPart.manufacturerPartNumber}"
                                th:value5="${masterPart.manufacturerPartName}"
                                th:text="${masterPart.catenaxId}">
                        </option>
                    </select>
                    <input type="text"
                           th:if="${#lists.isEmpty(masterpartList)}"
                           th:field="*{catenaxId}"
                           readonly />
                </div>
            </div>

            <div class="form-group">
                <label for="customerPartNumber" th:text="#{customs_edit_customer_part_number}">Kundensachnummer</label>
                <input type="text" id="customerPartNumber" th:field="*{customerPartNumber}" readonly />
            </div>

            <div class="form-group">
                <label for="customerPartName" th:text="#{customs_edit_customer_part_name}">Bezeichnung Kundensachnummer</label>
                <input type="text" id="customerPartName" th:field="*{customerPartName}" readonly />
            </div>

            <div class="form-group">
                <label for="manufacturerPartNumber" th:text="#{customs_edit_manufacturer_part_number}">Sachnummer</label>
                <input type="text" id="manufacturerPartNumber" th:field="*{manufacturerPartNumber}" readonly />
            </div>

            <div class="form-group">
                <label for="manufacturerPartName" th:text="#{customs_edit_manufacturer_part_name}">Bezeichnung Sachnummer</label>
                <input type="text" id="manufacturerPartName" th:field="*{manufacturerPartName}" readonly />
            </div>

            <!-- LLE Informationen -->
            <div class="form-group">
                <label for="type" th:text="#{customs_edit_type}">Type</label>
                <select id="type" th:field="*{type}">
                    <option value="" th:text="#{customs_edit_type_notset}">Typ auswählen</option>
                    <option th:each="type : ${types}" th:value="${type}"
                            th:with="typeName = 'customs_edit_type_' + ${type.name().toLowerCase()}"
                            th:text="#{${typeName}}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="validFrom" th:text="#{customs_edit_valid_from}">Gültig ab</label>
                <input type="date" id="validFrom" th:field="*{validFrom}" />
            </div>

            <!-- Kontakt Informationen -->
            <div class="form-group">
                <label for="contactName" th:text="#{customs_edit_contact_name}">Kontaktname</label>
                <input type="text" id="contactName" th:field="*{contactName}" />
            </div>

            <div class="form-group">
                <label for="contactEmail" th:text="#{customs_edit_contact_email}">Kontakt E-Mail</label>
                <input type="text" id="contactEmail" th:field="*{contactEmail}" />
            </div>

            <div class="form-group">
                <label for="contactPhone" th:text="#{customs_edit_contact_phone}">Kontakt Telefon</label>
                <input type="text" id="contactPhone" th:field="*{contactPhone}" />
            </div>

            <div class="form-group">
                <label for="contactJobTitle" th:text="#{customs_edit_contact_jobtitle}">Kontakt Berufsbezeichnung</label>
                <input type="text" id="contactJobTitle" th:field="*{contactJobTitle}" />
            </div>

            <!-- Standort -->
            <div class="form-group">
                <label for="country" th:text="#{customs_edit_country}">Land</label>
                <select id="country" th:field="*{country}" onchange="toggleCountrySelectionChanged()">
                    <option value="" th:text="#{customs_edit_country_notset}">Land auswählen</option>
                    <option th:each="country : ${countries}" th:value="${country}"
                            th:with="countryName = 'customs_edit_country_' + ${country.getCode().toLowerCase()}"
                            th:text="${country.getCode()} + ' - ' + #{${countryName}}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="federalState" th:text="#{customs_edit_federal_state}">Bundesland</label>
                <select id="federalState" th:field="*{federalState}">
                    <option value="" th:text="#{customs_edit_federal_state_notset}">Bundesland auswählen</option>
                    <option th:each="federalState : ${federalStates}" th:value="${federalState}"
                            th:text="${federalState.getCode()} + ' - ' + ${federalState.getFederalStateName()}"></option>
                </select>
            </div>

            <!-- Origin Information -->
            <div class="form-group">
                <label for="originInformation" th:text="#{customs_edit_origin_information}">Ursprungsinformationen</label>
                <div class="origin-input-container">
                    <div class="origin-input-row">
                        <input type="text" id="originInformation" placeholder="Ursprungsland hinzufügen" />
                        <button type="button" onclick="addOriginInformationField()">Hinzufügen</button>
                    </div>
                    <div class="origin-list" id="originListContainer">
                        <div th:each="originInformation, iterStat : ${customs.originInformations}" class="origin-item">
                            <span th:text="${originInformation}">Ursprung</span>
                            <img src="/icon/delete.png" alt="Löschen" class="small-icon"
                                 style="cursor: pointer;"
                                 th:data-index="${iterStat.index}"
                                 onclick="removeOriginInformationField(this.dataset.index)">
                        </div>
                    </div>
                    <input id="originInformations" type="hidden" th:field="*{originInformations}" />
                </div>
            </div>

            <!-- Präferenzstatus -->
            <div class="form-group">
                <label for="prefferedStatus" th:text="#{customs_edit_preffered_status}">Präferenzstatus</label>
                <select id="prefferedStatus" th:field="*{prefferedStatus}" onchange="togglePrefferedStatusSelecttionChanged()">
                    <option th:each="prefferedStatus : ${certifiedOptions}"
                            th:value="${prefferedStatus}"
                            th:text="${prefferedStatus.getCode()}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="tracedWorthValue" th:text="#{customs_edit_traced_worth_value}">Handelswert</label>
                <input type="text" id="tracedWorthValue" th:field="*{tracedWorthValue}" />
            </div>

            <div class="form-group">
                <label for="tracedWorthCurrency" th:text="#{customs_edit_traced_worth_currency}">Währung</label>
                <input type="text" id="tracedWorthCurrency" th:field="*{tracedWorthCurrency}" />
            </div>

            <div class="form-group">
                <label for="completed" th:text="#{customs_edit_completed}">Abgeschlossen</label>
                <input type="checkbox" id="completed" th:field="*{completed}" style="width: auto;" />
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" th:text="${customs.catenaxId} == null ? #{customs_edit_action_create} : #{customs_edit_action_update}">Speichern</button>
            <button type="button" onclick="location.href='/customs'" th:text="#{customs_edit_action_cancel}" class="btn-secondary">Abbrechen</button>
        </div>
    </form>
</div>

<script>
function toggleMenu() {
    const menu = document.getElementById('nav-menu');
    menu.classList.toggle('active');
}

// Close menu when clicking on a link (mobile)
document.querySelectorAll('#nav-menu a').forEach(link => {
    link.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
            document.getElementById('nav-menu').classList.remove('active');
        }
    });
});
</script>
</body>
</html>
