<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <title>Tasks</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" />
</head>
<body>
<div class ="header">
    <ul>
        <li><a href="/" th:text="#{menu_home}">4</a></li>
        <li><a href="/tasks" th:text="#{menu_tasks}">4</a></li>
        <li><a href="/parts" th:text="#{menu_parts}">4</a></li>
        <li><a href="/customs" th:text="#{menu_lle}">4</a></li>
        <li><a href="#" th:text="#{menu_user}">4</a></li>
        <img src="icon/msg_systems_logo_RGB.svg" alt="Logo" class="logo">
    </ul>
</div>
<div class="main">
    <h1 th:text="#{task_overview_header}">Tasks</h1>
    <button onclick="location.href='/customs/part/create'" th:text="#{task_overview_action_work}">Aufgabe beantworten</button>
    <button onclick="location.href='#'" th:text="#{task_overview_action_decline}">Aufgabe verwerfen</button>

    <table id="dataTable">
    <thead>
    <tr>
        <th th:text="#{task_overview_select}">Select</th>
        <th th:text="#{task_overview_catenax_id}">Catena-X ID</th>
        <th th:text="#{task_overview_customer_part_number}">Kundensachnummer</th>
        <th th:text="#{task_overview_customer_part_name}">Bezeichnung Kundensachnummer</th>
        <th th:text="#{task_overview_part_number}">Sachnummer</th>
        <th th:text="#{task_overview_part_name}">Bezeichnung Sachnummer</th>
        <th th:text="#{task_overview_request_date}">Anfragedatum</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="task :${taskList}">
        <td><input type="checkbox" name="selectedIds" th:value="${task.catenaxID}" /></td>
        <td th:text="${task.catenaxID}">4</td>
        <td th:text="${task.customerPartNumber}">4</td>
        <td th:text="${task.customerPartName}">4</td>
        <td th:text="${task.manufacturerPartNumber}">4</td>
        <td th:text="${task.manufacturerPartName}">4</td>
        <td th:text="${task.requestDate}">4</td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
